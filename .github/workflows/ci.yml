name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (framework stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install pandas numpy requests pytest ruff
      - run: ruff check src ft tests
      - run: pytest -q

  integration:
    name: Tests inside the real Freqtrade image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -t aitrader:ci .
      - name: Run full test suite against real freqtrade + fastapi
        run: |
          docker run --rm -v "$PWD/tests:/app/tests" -w /app --entrypoint "" aitrader:ci \
            sh -c "pip install --user -q pytest && python -m pytest -q tests"
      - name: Freqtrade loads every strategy; hyperopt loss imports
        run: |
          docker run --rm -w /app --entrypoint "" aitrader:ci sh -c \
            "freqtrade create-userdir --userdir /tmp/ud && freqtrade list-strategies --userdir /tmp/ud --strategy-path ft/strategies -1 | tee /tmp/s.txt && grep -q AIPortfolio /tmp/s.txt && grep -q FamSqueeze /tmp/s.txt && python -c 'import sys; sys.path.insert(0, \"ft/hyperopts\"); from AIRobustLoss import AIRobustLoss; from freqtrade.optimize.hyperopt import IHyperOptLoss; assert issubclass(AIRobustLoss, IHyperOptLoss); print(\"AIRobustLoss ok\")'"
