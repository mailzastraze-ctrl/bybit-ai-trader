name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (framework stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pandas numpy pytest ruff
      - run: ruff check src ft tests
      - run: pytest -q

  integration:
    name: Tests inside the real Freqtrade image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t aitrader:ci .
      - name: Run full test suite against real freqtrade + fastapi
        run: |
          docker run --rm -v "$PWD/tests:/app/tests" -w /app --entrypoint "" aitrader:ci \
            sh -c "pip install --user -q pytest && python -m pytest -q tests"
      - name: Freqtrade can load every strategy and the hyperopt loss
        run: |
          docker run --rm -w /app --entrypoint "" aitrader:ci sh -c \
            "freqtrade list-strategies --strategy-path ft/strategies -1 && freqtrade list-hyperoptloss --hyperopt-path ft/hyperopts -1 | grep AIRobustLoss"
