name: hq-preview
# Render the 3D HQ in headless Chromium with isolated test fixtures.
on:
  push:
    branches: [main]
    paths: ["src/aitrader/web/**", "scripts/hq_preview.py", ".github/workflows/hq-preview.yml"]
  pull_request:
    paths: ["src/aitrader/web/**", "scripts/hq_preview.py", ".github/workflows/hq-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -q -e . pandas numpy requests psutil fastapi uvicorn httpx playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render HQ and take screenshots
        run: python scripts/hq_preview.py --out docs/preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hq-render
          path: docs/preview
          retention-days: 7
