name: research-lab
# The company's research lab. All heavy compute (hyperopt, walk-forward backtests, stress,
# robustness, Monte Carlo) runs here on GitHub runners — never on the trading server.
#
#   prep   – asks the live server what to work on (learnings, revalidations, promising
#            strategies), picks the data source, scans the universe → plan
#   run ×4 – four parallel runners (4 vCPU each), each a budgeted stream of walk-forward
#            experiments opening with a different strategy family; live progress → HQ
#   screen – stage 1: owner's Strategy Lab engine (Node) screens thousands of combinations,
#            survivors (steady + profitable on the unseen last 40%) go to the runners first;
#            autopilot (swing): top 15 coins on 2h–12h, ~3 years + last 3 months, seven checks
#            (stability, robustness, walk-forward, last 3 months, Monte Carlo, other coins) and
#            target–decoy control; accepted strategies trade every coin they passed on
#   shadow – forward test: every frozen strategy on Bybit candles after its freeze time
#   merge  – Deflated Sharpe over EVERY trial (90-day ledger + all four runners), compact
#            results → server import + research/ commit, registry backup, next run
#
# Data: real Bybit USDT perps (1h candles, funding, mark prices). Bybit blocks US IPs, so the
# lab tunnels its public market-data requests through the live server's EU egress proxy
# (short-lived credentials via OIDC). Fallback: OKX data if the proxy is unavailable.
# Auth to the server: GitHub OIDC token (no secrets stored anywhere).
on:
  schedule:
    - cron: "17 2,14 * * *"          # base cadence (also fits private-repo free minutes)
    - cron: "41 5,8,11,17,20,23 * * *" # extra restarts for public repos (chain watchdog)
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Research time budget (empty = auto: 170 public / 22 private)"
        default: ""
      chain:
        description: "Start the next run when done (public repos)"
        default: "true"

permissions:
  contents: write   # commit results/ledger
  id-token: write   # OIDC token for the live server
  actions: write    # chain the next run

concurrency:
  group: research-lab
  cancel-in-progress: false

env:
  RESEARCH_EXCHANGE: okx
  JOBS: "4"
  LAB_SERVER: https://aitrader-production-cf456409.up.railway.app

jobs:
  prep:
    if: github.event_name != 'schedule' || github.event.schedule == '17 2,14 * * *' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      public: ${{ steps.plan.outputs.public }}
      budget: ${{ steps.plan.outputs.budget }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: |
          PRIVATE="${{ github.event.repository.private }}"
          if [ "$PRIVATE" = "false" ]; then PUBLIC=true; BUDGET=150; J='[0,1,2,3]'; else PUBLIC=false; BUDGET=22; J='[0]'; fi
          [ -n "${{ inputs.budget_minutes }}" ] && BUDGET="${{ inputs.budget_minutes }}"
          echo "public=$PUBLIC" >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
          echo "jobs=$J" >> "$GITHUB_OUTPUT"
          echo "public=$PUBLIC budget=${BUDGET}min runners=$J"
      - run: docker build -q -t aitrader:research .
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-1h-${{ github.run_id }}
          restore-keys: |
            mkt-all-
            mkt-1h-
      - name: State, data source, universe
        run: |
          mkdir -p work/batch && chmod -R 777 work
          N=$(echo '${{ steps.plan.outputs.jobs }}' | tr -cd ',' | wc -c); N=$((N+1))
          docker run --rm -v "$PWD/work:/data" \
            -e RESEARCH_EXCHANGE -e LAB_PUBLIC=${{ steps.plan.outputs.public }} \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e RESEARCH_UNIVERSE=40 \
            aitrader:research python -m aitrader.research.batch lab-prep --out /data/batch \
              --budget-min ${{ steps.plan.outputs.budget }} --jobs $N --run-id ${{ github.run_id }} --server "$LAB_SERVER"
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" work
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-1h-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: lab-plan
          path: work/batch/plan.json
          retention-days: 3

  screen:
    # stage 1: the owner's Strategy Lab engine (Node) tries thousands of strategy × parameter ×
    # exit combinations per coin and timeframe; only those that stay profitable with a steady
    # equity curve on the unseen last 40% of the history go on to the walk-forward runners
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - run: docker build -q -t aitrader:research .
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-1h-${{ github.run_id }}
          restore-keys: mkt-all-
      - uses: actions/download-artifact@v4
        with:
          name: lab-plan
          path: work/batch
      - name: Bybit candles for the screener (15m + 1h; top 15 coins on 2h–12h, ~3.3 years)
        run: |
          chmod -R 777 work
          docker run --rm -v "$PWD/work:/data" -e RESEARCH_EXCHANGE \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            aitrader:research python -m aitrader.research.batch lab-candles --out /data/batch \
              --run-id ${{ github.run_id }} --server "$LAB_SERVER"
          sudo chown -R "$(id -u):$(id -g)" work
      - uses: actions/cache/save@v4
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-all-${{ github.run_id }}
      - name: Mass screening (owner's engine)
        # pooled: one config across all coins (15m/1h). swing: the autopilot – rare, accurate trades
        # on 2h–12h, seven automatic checks + target–decoy control against lucky survivors
        run: node screener/screen.js --mode pooled,swing --data work/batch/candles --out work/batch/screen-results.json --combos 400 --top 5 --workers $(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: lab-screen
          path: work/batch/screen-results.json
          retention-days: 7
          if-no-files-found: ignore

  run:
    needs: [prep, screen]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 230
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.prep.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v5
      - run: docker build -q -t aitrader:research .
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-all-${{ github.run_id }}
          restore-keys: mkt-1h-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: lab-plan
          path: work/batch
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab-screen
          path: work/batch
      - name: Walk-forward experiments (runner ${{ matrix.job }})
        run: |
          chmod -R 777 work
          docker run --rm -v "$PWD/work:/data" -e RESEARCH_EXCHANGE \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e RESEARCH_EPOCHS=80 -e RESEARCH_JOBS=$(nproc) -e RESEARCH_UNIVERSE=40 \
            aitrader:research python -m aitrader.research.batch lab-run --out /data/batch \
              --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --budget-min ${{ needs.prep.outputs.budget }} \
              --run-id ${{ github.run_id }} --server "$LAB_SERVER"
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results-${{ matrix.job }}
          path: work/batch/job-${{ matrix.job }}/results-*.json
          retention-days: 7
          if-no-files-found: ignore

  shadow:
    # forward test: every frozen strategy of the server's book on Bybit candles after its
    # freeze time only (unseen data) → does the research find edges that keep working?
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - run: docker build -q -t aitrader:research .
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/user_data/data
            work/batch/universe.json
          key: mkt-1h-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: lab-plan
          path: work/batch
      - name: Forward test of the frozen strategy book
        run: |
          chmod -R 777 work
          docker run --rm -v "$PWD/work:/data" -e RESEARCH_EXCHANGE \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            aitrader:research python -m aitrader.research.batch lab-shadow --out /data/batch \
              --jobs $(nproc) --run-id ${{ github.run_id }} --server "$LAB_SERVER"
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results-shadow
          path: work/batch/shadow/shadow-results.json
          retention-days: 7
          if-no-files-found: ignore

  merge:
    needs: [prep, screen, run, shadow]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -q -t aitrader:research .
      - uses: actions/download-artifact@v4
        with:
          name: lab-plan
          path: work/batch
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lab-results-*
          path: work/batch/results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab-screen
          path: work/batch/results/screen
      - name: Deflated Sharpe over all trials → live server
        run: |
          mkdir -p work/export work/batch/results && chmod -R 777 work
          cp research/ledger.json work/ledger.json 2>/dev/null || echo '{"trials": []}' > work/ledger.json
          docker run --rm -v "$PWD/work:/data" -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            aitrader:research python -m aitrader.research.batch lab-merge --out /data/batch \
              --results /data/batch/results --run-id ${{ github.run_id }} --server "$LAB_SERVER" \
              --ledger /data/ledger.json --export /data/export
          sudo chown -R "$(id -u):$(id -g)" work
      - name: Commit results (history + fallback import on deploy)
        run: |
          if ! ls work/export/imports/*.json >/dev/null 2>&1; then echo "no results"; exit 0; fi
          mkdir -p research/imports research/reports
          cp work/export/imports/*.json research/imports/ && cp work/export/reports/*.md research/reports/
          cp work/export/ledger.json research/ledger.json
          [ -f work/export/screen.json ] && cp work/export/screen.json research/screen.json || true
          cat work/export/reports/*.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "aitrader-research-lab"
          git config user.email "aitrader-research-lab@users.noreply.github.com"
          git add research/imports research/reports research/ledger.json research/screen.json 2>/dev/null || git add research/imports research/reports research/ledger.json
          git commit -q -m "research-lab: run ${{ github.run_id }} results [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Back up the live registry (trades, strategies, learnings)
        continue-on-error: true
        run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aitrader-lab" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          mkdir -p backup && curl -sf -H "Authorization: Bearer $TOK" -o backup/registry.sqlite.gz "$LAB_SERVER/api/lab/backup" && ls -la backup
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: registry-backup
          path: backup/registry.sqlite.gz
          retention-days: 30
          if-no-files-found: ignore
      - name: Chain the next run (continuous research on public repos)
        if: needs.prep.outputs.public == 'true' && inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research.yml --ref main -f chain=true || true
