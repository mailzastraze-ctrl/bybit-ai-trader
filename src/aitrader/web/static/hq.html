<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trader HQ · Bybit Demo</title>
<style>
:root {
  --glass: rgba(16, 18, 24, .78); --line: rgba(255,255,255,.09); --text: #f0efec; --text2: #c3c2b7; --muted: #8d8c84;
  --blue: #3987e5; --red: #e66767; --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: var(--text); font: 13px/1.4 var(--sans); }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: stretch; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
.brand { padding: 9px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 170px; }
.brand b { font-size: 14px; letter-spacing: .08em; }
.brand span { font-size: 10.5px; color: var(--warn); letter-spacing: .04em; }
.stat { padding: 8px 14px; min-width: 118px; }
.stat .l { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }
.stat .v { font: 600 18px/1.3 var(--mono); }
.stat .s { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.btn { align-self: center; background: var(--glass); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 8px 12px; cursor: pointer; font: inherit; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: rgba(255,255,255,.3); }
.btn.on { border-color: var(--blue); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: auto; cursor: pointer; padding: 5px 9px; font-size: 11px; border-radius: 9px; }
.tag b { display: block; font-size: 11px; letter-spacing: .05em; }
.tag i { font-style: normal; font-family: var(--mono); color: var(--text2); font-size: 10.5px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.bubble { position: absolute; transform: translate(-50%, -100%) scale(.85); transform-origin: 50% 100%; max-width: 240px; white-space: normal; background: #fbfaf6; color: #15161a; border-radius: 12px; padding: 6px 10px; font-size: 11.5px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.4); opacity: 0; transition: opacity .25s, transform .25s; }
.bubble.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
.bubble .who { display: block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: #6b6a63; margin-bottom: 1px; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #fbfaf6; border-bottom: 0; }
.nametag { position: absolute; transform: translate(-50%, -100%); font-size: 10.5px; padding: 3px 7px; border-radius: 7px; background: rgba(10,12,16,.88); border: 1px solid var(--line); white-space: nowrap; display: none; }
#panel { position: fixed; right: 12px; top: 84px; bottom: 60px; width: 390px; padding: 14px 16px; overflow: auto; display: none; z-index: 6; }
#panel h2 { margin: 0 0 4px; font-size: 15px; }
#panel .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
#panel table { width: 100%; border-collapse: collapse; font: 11.5px var(--mono); }
#panel td, #panel th { padding: 4px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: left; color: var(--text2); white-space: nowrap; }
#panel th { color: var(--muted); font-weight: 500; }
#panel .x { position: absolute; right: 12px; top: 10px; cursor: pointer; color: var(--muted); font-size: 16px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font: 12px var(--mono); margin: 8px 0; }
.kv span:nth-child(odd) { color: var(--muted); }
.pos::before { content: "▲ "; color: var(--blue); font-size: 9px; } .neg::before { content: "▼ "; color: var(--red); font-size: 9px; }
#feed { position: fixed; left: 12px; bottom: 58px; width: 370px; max-height: 36vh; overflow: hidden; padding: 8px 10px; z-index: 4; display: flex; flex-direction: column; gap: 4px; }
#feed .h { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
#feed .ev { font-size: 11.5px; color: var(--text2); animation: slide .4s ease-out; }
#feed .ev b { color: var(--text); font-weight: 600; }
#feed .ev .t { font-family: var(--mono); color: var(--muted); font-size: 10.5px; margin-right: 6px; }
@keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
#ticker { position: fixed; left: 12px; right: 12px; bottom: 12px; height: 38px; overflow: hidden; display: flex; align-items: center; z-index: 4; }
#ticker .wrap { flex: 1; overflow: hidden; height: 100%; display: flex; align-items: center; }
#ticker .lbl { flex: none; padding: 0 12px; color: var(--muted); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; }
#ticker .track { white-space: nowrap; font: 12px var(--mono); color: var(--text2); animation: scroll 90s linear infinite; padding-left: 100%; }
@keyframes scroll { to { transform: translateX(-100%); } }
#loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #0b0d12; z-index: 20; transition: opacity .8s; }
#loader .bar { width: 220px; height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 40%; background: var(--blue); animation: load 1.2s ease-in-out infinite; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
#err { display: none; }
#goals { position: fixed; right: 12px; top: 84px; width: 330px; padding: 10px 12px; z-index: 4; }
#goals .h { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#goals .g { margin: 6px 0; }
#goals .gt { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text2); }
#goals .gt b { font: 600 11px var(--mono); color: var(--text); white-space: nowrap; }
#goals .gt i { font-style: normal; color: var(--muted); }
#goals .gb { height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 3px; }
#goals .gb i { display: block; height: 100%; border-radius: 3px; transition: width 1s; }
.emote { position: absolute; transform: translate(-50%, -100%); font-size: 22px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
.emote.on { animation: pop 2.6s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; margin-top: 10px; } 12% { opacity: 1; margin-top: -4px; } 80% { opacity: 1; margin-top: -14px; } 100% { opacity: 0; margin-top: -24px; } }
.dots i { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: #8d8c84; animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (max-width: 900px) { #goals { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="hud">
  <div class="brand glass"><b>AI TRADER HQ</b><span>● BYBIT DEMO · simulated funds</span></div>
  <div class="stat glass"><div class="l">Equity</div><div class="v" id="hEq">–</div><div class="s" id="hEqS">USDT</div></div>
  <div class="stat glass"><div class="l">Realised P&L</div><div class="v" id="hPnl">–</div><div class="s" id="hPnlS"></div></div>
  <div class="stat glass"><div class="l">Positions</div><div class="v" id="hPos">–</div><div class="s" id="hPosS"></div></div>
  <div class="stat glass"><div class="l">Strategies</div><div class="v" id="hSl">–</div><div class="s" id="hSlS"></div></div>
  <div class="stat glass"><div class="l">Research</div><div class="v" id="hRs">–</div><div class="s" id="hRsS"></div></div>
  <div class="spacer"></div>
  <button class="btn" id="bTour" title="Slow cinematic camera tour">🎥 Tour</button>
  <button class="btn" id="bReset">⌂ Overview</button>
  <a class="btn" href="/">Control room</a> <a class="btn" href="/terminal">Terminal →</a>
</div>
<div id="panel" class="glass"><span class="x" id="px">✕</span><div id="pbody"></div></div>
<div id="goals" class="glass"></div>
<div id="feed" class="glass"><div class="h">Office chatter · live events</div></div>
<div id="ticker" class="glass"><div class="lbl">Company log</div><div class="wrap"><div class="track" id="track">loading…</div></div></div>
<div id="loader"><div style="letter-spacing:.12em;font-weight:600">AI TRADER HQ</div><div class="bar"><i></i></div><div id="lmsg" style="color:#8d8c84;font-size:11.5px">building the office…</div><div id="err"><a class="btn" href="/terminal">3D engine unavailable – open the terminal</a></div></div>
<script type="module" src="/static/hq.js"></script>
<script>setTimeout(() => { if (!window.__hqReady) { document.getElementById("err").style.display = "block"; document.getElementById("lmsg").textContent = "Could not load the 3D engine (CDN)."; } }, 15000);</script>
</body>
</html>
