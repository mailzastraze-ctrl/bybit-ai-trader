<!DOCTYPE html>
<html lang="ru">
<head>

<title>AI TRADER HQ · 3D-офис</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --sky-a: #8fb6d9; --sky-b: #dbe7f2; --sky-c: #f3e6d8;
  --glass: rgba(13, 18, 28, .86); --glass-2: rgba(22, 28, 40, .9); --stroke: rgba(255, 255, 255, .09); --stroke-2: rgba(255, 255, 255, .16);
  --text: #eef3f8; --text-2: #c3cedb; --muted: #8e9db1;
  --accent: #4ee6c4; --good: #3ddc97; --bad: #ff6b7a; --warn: #ffc15e; --info: #6aa8ff; --violet: #a78bfa;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --g: 14px; --r: 14px;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); font: 13px/1.45 var(--sans); background: #0b1120; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 58%, var(--sky-c) 100%); transition: background 2s; }
#sky::after { content: ""; position: absolute; inset: 0; opacity: var(--stars, 0); transition: opacity 2s;
  background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 32% 8%, #fff, transparent), radial-gradient(1.4px 1.4px at 58% 22%, #fff, transparent),
    radial-gradient(1px 1px at 78% 12%, #fff, transparent), radial-gradient(1.2px 1.2px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 44% 34%, #fff, transparent), radial-gradient(1px 1px at 6% 40%, #fff, transparent), radial-gradient(1.3px 1.3px at 68% 4%, #fff, transparent); }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; outline: none; }
.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: 0 10px 30px rgba(3, 8, 18, .28); -webkit- }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar */
#top { position: fixed; top: var(--g); left: var(--g); right: var(--g); display: flex; gap: 8px; align-items: stretch; z-index: 6; pointer-events: none; }
#top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 9px 14px 9px 11px; flex: none; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 800; letter-spacing: .02em; }
.brand small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px rgba(61, 220, 151, .18); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255, 107, 122, .2); }
.dot.warn { background: var(--warn); }
.demo { display: none; margin-left: 4px; padding: 1px 7px; border-radius: 99px; background: rgba(255, 193, 94, .16); color: var(--warn); font-size: 10.5px; font-weight: 700; }
body.is-demo .demo { display: inline-block; }
.kpis { display: flex; gap: 8px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.kpis::-webkit-scrollbar { display: none; }
.kpi { position: relative; display: grid; align-content: center; gap: 1px; padding: 8px 12px; min-width: 128px; flex: 1 1 0; max-width: 210px; overflow: hidden; cursor: pointer; text-align: left; }
.kpi .k { color: var(--muted); font-size: 11px; white-space: nowrap; }
.kpi .v { font: 700 18px/1.2 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.kpi .v small { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 3px; }
.kpi .s { color: var(--text-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi svg.spark { position: absolute; right: 8px; top: 10px; width: 42%; height: 26%; opacity: .7; pointer-events: none; }
.kpi .ring { position: absolute; right: 10px; top: 50%; translate: 0 -50%; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.actions { display: flex; gap: 6px; align-items: center; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--stroke); background: var(--glass); color: var(--text); text-decoration: none; cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap; -webkit- transition: background .15s, border-color .15s; }
.btn:hover { background: var(--glass-2); border-color: var(--stroke-2); }
.btn.on { border-color: rgba(78, 230, 196, .6); background: rgba(78, 230, 196, .14); }
.btn svg { width: 15px; height: 15px; }
#menu { position: fixed; top: 64px; right: var(--g); width: 250px; padding: 12px; z-index: 9; display: none; }
#menu.open { display: block; }
#menu h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.seg button { height: 30px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-2); }
.seg button.on { background: rgba(78, 230, 196, .18); color: var(--text); }
#menu p { margin: 9px 0 0; color: var(--muted); font-size: 11.5px; }
#menu label { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-2); cursor: pointer; }

/* ---------- world labels, bubbles */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.zl, .bubble, .tag { position: absolute; left: 0; top: 0; will-change: transform; }
.zl { display: flex; align-items: center; gap: 7px; padding: 6px 11px 6px 9px; border-radius: 99px; background: rgba(12, 16, 24, .72); border: 1px solid var(--stroke); color: var(--text); font-size: 12px; font-weight: 600;
  pointer-events: auto; cursor: pointer; white-space: nowrap; translate: -50% -50%; transition: opacity .35s, background .15s; -webkit- }
.zl:hover { background: rgba(26, 34, 48, .9); }
.zl i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.zl span { color: var(--muted); font-weight: 500; font-size: 11px; }
.zl.hidden { opacity: 0; pointer-events: none; }
.bubble { max-width: min(250px, 70vw); width: max-content; padding: 8px 11px 9px; border-radius: 12px; background: rgba(250, 251, 253, .97); color: #172031; font-size: 12px; line-height: 1.38; box-shadow: 0 8px 24px rgba(5, 12, 24, .28);
  translate: -50% calc(-100% - 10px); opacity: 0; transition: opacity .25s; }
.bubble.on { opacity: 1; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; translate: -50% 0; rotate: 45deg; background: rgba(250, 251, 253, .97); }
.bubble b { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; font-size: 10.5px; color: #5b6575; font-weight: 700; }
.bubble b i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tag { padding: 4px 9px; border-radius: 8px; background: rgba(12, 16, 24, .85); border: 1px solid var(--stroke); font-size: 11.5px; white-space: nowrap; translate: -50% calc(-100% - 6px); display: none; }
.tag small { color: var(--muted); margin-left: 4px; }

/* ---------- feed */
#feed { position: fixed; left: var(--g); bottom: calc(var(--g) + 104px); width: min(330px, 34vw); z-index: 4; padding: 10px 12px; }
#feed header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
#feed header b { font-size: 12.5px; }
#feed header button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 11.5px; }
#feed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; max-height: 172px; overflow: hidden; }
#feed.min ul { display: none; }
#feed li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12px; color: var(--text-2); animation: rise .35s ease-out; }
#feed li .who { color: var(--text); font-weight: 600; }
#feed li time { color: var(--muted); font: 10.5px var(--mono); margin-left: 4px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.av { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #0b1220; font-size: 10.5px; font-weight: 800; flex: none; }

/* ---------- dock (zones + team) */
#dock { position: fixed; left: 50%; bottom: var(--g); translate: -50% 0; z-index: 5; display: grid; gap: 6px; padding: 8px; width: max-content; max-width: calc(100vw - 2 * var(--g)); }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
.row::-webkit-scrollbar { display: none; }
.zb { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid transparent; background: rgba(255, 255, 255, .04); cursor: pointer; white-space: nowrap; font-size: 12.5px; font-weight: 600; color: var(--text-2); flex: none; }
.zb:hover, .zb.on { background: rgba(255, 255, 255, .09); color: var(--text); border-color: var(--stroke); }
.zb i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pb { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 10px 0 4px; border-radius: 99px; border: 1px solid transparent; background: rgba(255, 255, 255, .04); cursor: pointer; flex: none; white-space: nowrap; }
.pb:hover, .pb.on { background: rgba(255, 255, 255, .09); border-color: var(--stroke); }
.pb .av { width: 30px; height: 30px; font-size: 12px; box-shadow: 0 0 0 2px rgba(12, 16, 24, .9), 0 0 0 3.5px var(--ring, transparent); }
.pb span { display: grid; line-height: 1.15; text-align: left; }
.pb span b { font-size: 12px; } .pb span small { color: var(--muted); font-size: 10.5px; max-width: 112px; overflow: hidden; text-overflow: ellipsis; }
#dock:not(:hover) .pb:not(.on) span small { display: none; }

/* ---------- side panel */
#panel { position: fixed; top: 76px; right: var(--g); bottom: calc(var(--g) + 104px); width: min(400px, calc(100vw - 2 * var(--g))); z-index: 7; display: none; flex-direction: column; overflow: hidden; }
#panel.open { display: flex; animation: slidein .3s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateX(16px); } }
#panel .ph { display: flex; align-items: center; gap: 11px; padding: 14px 14px 12px; border-bottom: 1px solid var(--stroke); }
#panel .ph .av { width: 40px; height: 40px; font-size: 15px; }
#panel .ph .zi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); }
#panel .ph .zi i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
#panel .ph h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
#panel .ph p { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
#panel .x { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--stroke); background: transparent; cursor: pointer; color: var(--text-2); font-size: 15px; flex: none; }
#panel .x:hover { background: rgba(255, 255, 255, .06); }
#panel .pb2 { padding: 12px 14px 16px; overflow: auto; scrollbar-width: thin; scrollbar-color: #33415a transparent; }
.now { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
.now .dot { animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
figure.screen { margin: 0 0 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--stroke); background: #05070b; }
figure.screen canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; }
figure.screen figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 7px 10px; font-size: 11.5px; color: var(--muted); background: rgba(255, 255, 255, .03); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.badge.live { background: rgba(61, 220, 151, .14); color: var(--good); } .badge.mixed { background: rgba(106, 168, 255, .14); color: var(--info); } .badge.illus { background: rgba(255, 255, 255, .08); color: var(--text-2); }
.duty { margin: 0 0 10px; color: var(--text-2); font-size: 12.5px; }
blockquote { margin: 0 0 12px; padding: 8px 11px; border-left: 3px solid var(--c, var(--accent)); background: rgba(255, 255, 255, .04); border-radius: 0 10px 10px 0; font-size: 12.5px; color: var(--text); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sec { margin: 14px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, .045); }
.stat span { display: block; color: var(--muted); font-size: 11px; }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 5px 4px; border-bottom: 1px solid var(--stroke); }
table.t td { padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, .05); color: var(--text-2); font-variant-numeric: tabular-nums; }
table.t td.r, table.t th.r { text-align: right; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 700; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--info)); }
.goal { margin: 8px 0; }
.goal div { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-2); }
.goal div b { color: var(--text); white-space: nowrap; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, .05); font-size: 12px; color: var(--text-2); }
.li b { color: var(--text); font-weight: 600; }
.note { margin-top: 12px; color: var(--muted); font-size: 11.5px; }
.who { display: flex; flex-wrap: wrap; gap: 6px; }
.who button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 4px; border-radius: 99px; border: 1px solid var(--stroke); background: rgba(255, 255, 255, .04); cursor: pointer; font-size: 12px; }

/* ---------- tour caption, loader, toast */
#caption { position: fixed; left: 50%; top: 84px; translate: -50% 0; z-index: 5; padding: 10px 16px; text-align: center; display: none; max-width: min(560px, 90vw); }
#caption.on { display: block; animation: rise .4s ease-out; }
#caption b { display: block; font-size: 15px; } #caption span { color: var(--text-2); font-size: 12.5px; }
#loader { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1a2944, #0a101c 70%); transition: opacity .8s; }
#loader .in { display: grid; justify-items: center; gap: 14px; }
#loader b { font-size: 18px; letter-spacing: .04em; }
#loader .track { width: 220px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
#loader .track i { display: block; height: 100%; width: 10%; background: linear-gradient(90deg, var(--accent), var(--info)); transition: width .4s; }
#loader p { margin: 0; color: var(--muted); font-size: 12.5px; }
#loader a { display: none; }
#toast { position: fixed; left: 50%; top: 76px; translate: -50% 0; z-index: 8; padding: 8px 14px; display: none; font-size: 12.5px; }
#toast.on { display: block; }
#fps { position: fixed; right: var(--g); bottom: calc(var(--g) + 108px); z-index: 4; font: 11px var(--mono); color: var(--muted); display: none; padding: 3px 7px; }
.in-tour #feed, .in-tour .zl { display: none; }

@media (max-width: 1180px) { .kpi:nth-child(n+5) { display: none; } }
@media (max-width: 900px) {
  :root { --g: 10px; }
  #top { flex-wrap: wrap; }
  .brand { flex: 1; }
  .kpis { order: 3; flex: 1 1 100%; }
  .kpi { min-width: 118px; }
  .kpi:nth-child(n+5) { display: grid; }
  .actions .lbl { display: none; }
  #feed { display: none; }
  #panel { top: auto; bottom: calc(var(--g) + 104px); height: 52vh; }
  #caption { top: auto; bottom: 130px; }
}
@media (max-width: 560px) {
  .brand small { flex-wrap: wrap; row-gap: 2px; } .brand small .long { display: none; }
  .pb > span:not(.av) { display: none; } .pb { padding: 0 4px; }
  .zl { font-size: 11px; padding: 4px 9px 4px 7px; } .zl span { display: none; }
  .zb { height: 30px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* frosted glass costs a full-screen blur every frame over the 3D canvas: only on "high" quality */
body.q-high .glass, body.q-high .btn { --glass: rgba(13, 17, 26, .7); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); }
</style>

<body>
<div id="sky"></div>
<div id="scene" aria-label="3D-офис компании"></div>
<div id="labels"></div>

<header id="top">
  <div class="brand glass">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#4ee6c4"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient></defs><rect width="30" height="30" rx="9" fill="#111a2a"/><path d="M6 21l6-6 4 3 7-9" fill="none" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.4" fill="#6aa8ff"/></svg>
    <div><b>AI TRADER HQ</b><small><i class="dot" id="botDot"></i><span id="botTxt">подключение…</span><span class="long">· Bybit Demo, не реальные деньги</span><span class="demo">демо-данные</span></small></div>
  </div>
  <div class="kpis" id="kpis">
    <button class="kpi glass" data-zone="ceo"><span class="k">Капитал</span><span class="v" id="kCap">—</span><span class="s" id="kCapS">USDT</span><svg class="spark" id="kSpark" viewBox="0 0 100 30" preserveAspectRatio="none"></svg></button>
    <button class="kpi glass" data-zone="trading"><span class="k">Результат демо</span><span class="v" id="kPnl">—</span><span class="s" id="kPnlS">закрытые сделки</span></button>
    <button class="kpi glass" data-zone="trading"><span class="k">В рынке</span><span class="v" id="kPos">—</span><span class="s" id="kPosS"></span></button>
    <button class="kpi glass" data-zone="research"><span class="k">Лаборатория</span><span class="v" id="kLab">—</span><span class="s" id="kLabS"></span></button>
    <button class="kpi glass" data-zone="risk"><span class="k">Готовность к деньгам</span><span class="v" id="kRd">—</span><span class="s" id="kRdS">проверок пройдено</span><svg class="ring" width="34" height="34" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="kRing" cx="18" cy="18" r="15" fill="none" stroke="#4ee6c4" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" transform="rotate(-90 18 18)" pathLength="100"/></svg></button>
  </div>
  <div class="actions">
    <button class="btn" id="bTour" type="button" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg><span class="lbl">Экскурсия</span></button>
    <button class="btn" id="bHome" type="button"><svg viewBox="0 0 16 16"><path d="M2.5 7.5L8 3l5.5 4.5V13h-4v-3h-3v3h-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="lbl">Обзор</span></button>
    <button class="btn" id="bMenu" type="button" aria-label="Настройки"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <a class="btn" id="bBack" href="/#overview" target="_top"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="lbl">Пульт</span></a>
  </div>
</header>
