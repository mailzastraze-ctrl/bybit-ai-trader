<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trader · Bybit Demo terminal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121211; --surface-1: #1a1a19; --surface-2: #232321; --line: #2e2e2b;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8d8c84;
  --series-1: #3987e5; --pos: #3987e5; --neg: #e66767; --mid: #383835;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font: 13px/1.45 var(--sans); }
header { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface-1); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 14px; margin: 0; letter-spacing: .04em; font-weight: 650; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; }
nav { display: flex; gap: 2px; margin-left: 8px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--text-secondary); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active, nav button:hover { background: var(--surface-2); color: var(--text-primary); }
.spacer { flex: 1; }
main { padding: 18px 20px 40px; max-width: 1500px; margin: 0 auto; }
.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; }
.kpi .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.kpi .value { font: 600 22px/1.2 var(--mono); margin-top: 4px; }
.kpi .sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; font-family: var(--mono); }
.two { grid-template-columns: 2fr 1fr; } @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface-1); }
td { padding: 5px 8px; border-bottom: 1px solid var(--surface-2); white-space: nowrap; color: var(--text-secondary); }
td.num, th.num { text-align: right; }
tr:hover td { background: var(--surface-2); }
.scroll { max-height: 520px; overflow: auto; }
.pos { color: var(--text-primary); } .pos::before { content: "▲ "; color: var(--pos); font-size: 9px; }
.neg { color: var(--text-primary); } .neg::before { content: "▼ "; color: var(--neg); font-size: 9px; }
.stage { padding: 1px 7px; border-radius: 4px; font-size: 11px; border: 1px solid var(--line); color: var(--text-primary); }
.stage::before { content: "●"; margin-right: 5px; }
.stage.production::before { color: var(--good); } .stage.incubation::before, .stage.eligible::before { color: var(--series-1); }
.stage.exploration::before { color: var(--warning); } .stage.closing::before, .stage.validated::before, .stage.exploratory::before { color: var(--text-muted); }
.stage.retired::before, .stage.rejected::before { color: var(--critical); }
.gate { display: inline-block; font-size: 10px; padding: 0 5px; margin: 1px; border-radius: 3px; border: 1px solid var(--line); }
.gate.ok::before { content: "✓ "; color: var(--good); } .gate.no::before { content: "✗ "; color: var(--critical); }
.muted { color: var(--text-muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: 11px var(--mono); color: var(--text-primary); display: none; white-space: nowrap; }
.empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
.btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-primary); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
.btn:hover { border-color: var(--text-muted); }
.note { color: var(--text-muted); font-size: 11px; margin-top: 8px; }
pre { white-space: pre-wrap; word-break: break-word; font: 11px var(--mono); color: var(--text-secondary); margin: 0; }
details summary { cursor: pointer; color: var(--text-secondary); }
.gates { white-space: normal; min-width: 240px; max-width: 340px; }
</style>
</head>
<body>
<header>
  <h1>AI TRADER</h1>
  <span class="badge" title="All execution goes to Bybit Demo (simulated funds)"><span class="dot" style="background:var(--warning)"></span>BYBIT DEMO · no real money</span>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span class="badge" id="botBadge"><span class="dot"></span>bot</span>
  <span class="badge muted" id="updated">–</span>
</header>
<main id="view"></main>
<script>
const TABS = ["Overview", "Trades", "Strategies", "Research", "Market", "Learnings", "Health", "Events"];
let tab = location.hash.slice(1) || "Overview";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const num = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? "–" : (Number(v) * 100).toFixed(d) + "%";
const signed = (v, f = num) => `<span class="${v >= 0 ? "pos" : "neg"}">${f(v)}</span>`;
const ago = ts => { if (!ts) return "–"; const s = (Date.now() - Date.parse(ts.replace(" ", "T") + (ts.endsWith("Z") || ts.includes("+") ? "" : "Z"))) / 1000; return s < 5 ? "just now" : s < 90 ? `${s | 0}s ago` : s < 5400 ? `${(s / 60) | 0}m ago` : s < 172800 ? `${(s / 3600) | 0}h ago` : `${(s / 86400) | 0}d ago`; };
const stage = s => `<span class="stage ${esc(s)}">${esc(s)}</span>`;
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); }

function nav() {
  $("#nav").innerHTML = TABS.map(t => `<button class="${t === tab ? "active" : ""}" data-t="${t}">${t}</button>`).join("");
  $("#nav").onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; location.hash = t; nav(); render(); } };
}

function table(cols, rows, empty = "No data yet") {
  if (!rows || !rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// Line chart: one series, crosshair + tooltip.
function lineChart(el, pts, fmt) {
  if (pts.length < 2) { el.innerHTML = `<div class="empty">Equity history appears after the first snapshots</div>`; return; }
  const W = el.clientWidth || 800, H = 220, P = {l: 64, r: 12, t: 10, b: 24};
  const xs = pts.map(p => p.t), ys = pts.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .08; y0 -= pad; y1 += pad;
  const X = t => P.l + (t - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = [0, .25, .5, .75, 1].map(f => y0 + f * (y1 - y0));
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="var(--mono)">${num(v, 0)}</text>`).join("")}
    <text x="${P.l}" y="${H - 6}" fill="var(--text-muted)" font-size="10">${new Date(x0).toLocaleDateString()}</text>
    <text x="${W - P.r}" y="${H - 6}" text-anchor="end" fill="var(--text-muted)" font-size="10">${new Date(x1).toLocaleDateString()}</text>
    <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
    <line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>
    <circle class="pt" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2" visibility="hidden"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el), pt = $(".pt", el);
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let best = pts[0]; for (const p of pts) if (Math.abs(X(p.t) - mx) < Math.abs(X(best.t) - mx)) best = p;
    xh.setAttribute("x1", X(best.t)); xh.setAttribute("x2", X(best.t)); xh.setAttribute("visibility", "visible");
    pt.setAttribute("cx", X(best.t)); pt.setAttribute("cy", Y(best.v)); pt.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.innerHTML = `${new Date(best.t).toLocaleString()}<br><b>${fmt(best.v)}</b>`;
    const left = X(best.t) * r.width / W; tip.style.left = Math.min(left + 10, r.width - 170) + "px"; tip.style.top = "8px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); pt.setAttribute("visibility", "hidden"); };
}

// Diverging bars (daily P&L): blue up, red down, gray zero line, hover tooltip.
function barChart(el, bars) {
  if (!bars.length) { el.innerHTML = `<div class="empty">No daily results yet</div>`; return; }
  const W = el.clientWidth || 400, H = 160, P = {l: 48, r: 8, t: 8, b: 20};
  const m = Math.max(1e-9, ...bars.map(b => Math.abs(b.v)));
  const bw = (W - P.l - P.r) / bars.length, Y = v => P.t + (1 - (v + m) / (2 * m)) * (H - P.t - P.b), z = Y(0);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">
    <text x="${P.l - 6}" y="${Y(m) + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="var(--mono)">${num(m, 0)}</text>
    <text x="${P.l - 6}" y="${Y(-m) + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="var(--mono)">${num(-m, 0)}</text>
    ${bars.map((b, i) => { const y = Math.min(Y(b.v), z), h = Math.max(1, Math.abs(Y(b.v) - z));
      return `<rect data-i="${i}" x="${P.l + i * bw + 1}" y="${y}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="${b.v >= 0 ? "var(--pos)" : "var(--neg)"}"/>`; }).join("")}
    <line x1="${P.l}" x2="${W - P.r}" y1="${z}" y2="${z}" stroke="var(--mid)" stroke-width="1.5"/>
    <text x="${P.l}" y="${H - 5}" fill="var(--text-muted)" font-size="10">${esc(bars[0].d)}</text>
    <text x="${W - P.r}" y="${H - 5}" text-anchor="end" fill="var(--text-muted)" font-size="10">${esc(bars[bars.length - 1].d)}</text></svg><div class="tip"></div>`;
  const svg = $("svg", el), tip = $(".tip", el);
  svg.onmousemove = e => { const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width, i = Math.floor((mx - P.l) / bw);
    if (i < 0 || i >= bars.length) { tip.style.display = "none"; return; }
    tip.style.display = "block"; tip.innerHTML = `${esc(bars[i].d)}<br><b>${num(bars[i].v)} USDT</b> · ${bars[i].n} trades`;
    tip.style.left = Math.min((P.l + i * bw) * r.width / W + 8, r.width - 150) + "px"; tip.style.top = "6px"; };
  svg.onmouseleave = () => tip.style.display = "none";
}

const R = {};
R.Overview = async v => {
  const d = await api("/api/overview");
  const bal = d.balance || {}, pr = d.profit || {};
  const eq = d.equity.map(r => ({t: Date.parse(r.ts + ":00Z"), v: r.equity}));
  v.innerHTML = `
  <div class="grid kpis">
    ${kpi("Equity (bot)", num(bal.total_bot ?? bal.total), bal.stake || "USDT")}
    ${kpi("Realised P&L", pr.profit_closed_coin !== undefined ? signed(pr.profit_closed_coin) : "–", pr.profit_closed_ratio_sum !== undefined ? `${pr.closed_trade_count} closed trades` : "")}
    ${kpi("Unrealised", pr.profit_all_coin !== undefined ? signed(pr.profit_all_coin - pr.profit_closed_coin) : "–", `${d.open_trades.length} open positions`)}
    ${kpi("Win rate", pr.winning_trades !== undefined ? pct(pr.winning_trades / Math.max(1, pr.winning_trades + pr.losing_trades), 1) : "–", pr.profit_factor ? `PF ${num(pr.profit_factor)}` : "")}
    ${kpi("Max drawdown", pr.max_drawdown !== undefined ? pct(pr.max_drawdown, 1) : "–", "account, closed trades")}
    ${kpi("Active sleeves", d.manifest.sleeves.filter(s => s.stage !== "closing").length, d.entries_paused ? "⚠ entries paused (kill-switch)" : "entries enabled")}
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h2>Equity · Bybit Demo account (bot share)</h2><div class="chart" id="eqc"></div></div>
    <div class="card"><h2>Daily P&L · last 30 days</h2><div class="chart" id="dpc"></div></div>
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h2>Open positions</h2>${table([
      {h: "Pair", k: "pair"}, {h: "Side", f: r => r.is_short ? "short" : "long"}, {h: "Sleeve", k: "enter_tag"},
      {h: "Entry", num: 1, f: r => num(r.open_rate, 4)}, {h: "Now", num: 1, f: r => num(r.current_rate, 4)},
      {h: "Stop", num: 1, f: r => num(r.stop_loss_abs, 4)}, {h: "Lev", num: 1, f: r => num(r.leverage, 1)},
      {h: "Stake", num: 1, f: r => num(r.stake_amount)}, {h: "P&L", num: 1, f: r => signed(r.profit_abs)}, {h: "%", num: 1, f: r => signed(r.profit_ratio, pct)},
      {h: "Opened", f: r => ago(r.open_date)}], d.open_trades, "No open positions")}</div>
    <div class="card"><h2>Latest events</h2>${table([{h: "When", f: r => ago(r.ts)}, {h: "Source", k: "source"}, {h: "Event", f: r => `<span style="white-space:normal">${esc(r.message)}</span>`}], d.events)}</div>
  </div>`;
  lineChart($("#eqc"), eq, x => num(x) + " USDT");
  const daily = ((d.daily || {}).data || []).slice().reverse().map(r => ({d: r.date, v: r.abs_profit, n: r.trade_count}));
  barChart($("#dpc"), daily);
};
const kpi = (l, v, s = "") => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`;

R.Trades = async v => {
  const d = await api("/api/trades");
  v.innerHTML = `<div class="card"><h2>Open (${d.open.length})</h2>${table([
    {h: "ID", k: "trade_id"}, {h: "Pair", k: "pair"}, {h: "Side", f: r => r.is_short ? "short" : "long"}, {h: "Sleeve", k: "enter_tag"},
    {h: "Entry", num: 1, f: r => num(r.open_rate, 4)}, {h: "Stop", num: 1, f: r => num(r.stop_loss_abs, 4)},
    {h: "P&L", num: 1, f: r => signed(r.profit_abs)}, {h: "Opened", k: "open_date"}], d.open, "No open positions")}</div>
  <div class="card" style="margin-top:12px"><h2>Closed demo trades (${d.closed.length})</h2>${table([
    {h: "ID", k: "trade_id"}, {h: "Closed", k: "close_date"}, {h: "Pair", k: "pair"}, {h: "Side", f: r => r.is_short ? "short" : "long"},
    {h: "Sleeve", k: "sleeve_id"}, {h: "Entry", num: 1, f: r => num(r.open_rate, 4)}, {h: "Exit", num: 1, f: r => num(r.close_rate, 4)},
    {h: "Lev", num: 1, f: r => num(r.leverage, 1)}, {h: "Stake", num: 1, f: r => num(r.stake_amount)},
    {h: "P&L", num: 1, f: r => signed(r.profit_abs)}, {h: "%", num: 1, f: r => signed(r.profit_ratio, pct)}, {h: "Exit reason", k: "exit_reason"}], d.closed, "No closed trades yet")}</div>`;
};

R.Strategies = async v => {
  const d = await api("/api/strategies");
  const sl = d.manifest.sleeves;
  v.innerHTML = `<div class="card"><h2>Live sleeves (manifest v${d.manifest.version || 0}, ${esc(d.manifest.updated || "–")})</h2>${table([
    {h: "Sleeve", k: "id"}, {h: "Stage", f: r => stage(r.stage)}, {h: "Family", k: "family"}, {h: "Risk/trade", num: 1, f: r => pct(r.risk, 2)},
    {h: "Lev", num: 1, f: r => num(r.leverage, 1)}, {h: "Sides", f: r => (r.sides || []).join("/")}, {h: "Pairs", f: r => `<span style="white-space:normal">${esc((r.pairs || []).join(", "))}</span>`}], sl, "No sleeves deployed")}</div>
  <div class="card" style="margin-top:12px"><h2>Strategy registry (${d.strategies.length})</h2>${table([
    {h: "ID", k: "id"}, {h: "Stage", f: r => stage(r.stage)}, {h: "Family", k: "family"}, {h: "Score", num: 1, f: r => num(r.score, 3)},
    {h: "OOS trades", num: 1, f: r => r.oos?.trades ?? "–"}, {h: "OOS PF", num: 1, f: r => num(r.oos?.profit_factor)}, {h: "OOS Sharpe", num: 1, f: r => num(r.oos?.sharpe)},
    {h: "OOS DD", num: 1, f: r => pct(r.oos?.max_drawdown, 1)}, {h: "DSR", num: 1, f: r => num(r.oos?.dsr, 2)},
    {h: "Live trades", num: 1, f: r => r.live?.trades ?? 0}, {h: "Live PF", num: 1, f: r => r.live?.trades ? num(r.live.profit_factor) : "–"}, {h: "Live P&L", num: 1, f: r => r.live?.trades ? signed(r.live.pnl) : "–"},
    {h: "Since", f: r => ago(r.stage_since)},
    {h: "Params / history", f: r => `<details><summary>view</summary><pre>${esc(JSON.stringify({params: r.params, pairs: r.pairs, history: r.history, note: r.note}, null, 1))}</pre></details>`}],
    d.strategies, "Research has not produced candidates yet")}
  <div class="note">Stages: rejected → exploratory → exploration (0.1% risk) · validated → incubation (0.25%) → eligible → production (0.75%) → retired. Promotion to production requires walk-forward OOS gates <i>and</i> forward demo-trading evidence the optimiser never saw.</div></div>`;
};

R.Research = async v => {
  const d = await api("/api/research");
  const fs = Object.entries(d.family_stats || {});
  const gf = Object.entries(d.gate_failures || {}).sort((a, b) => b[1] - a[1]);
  v.innerHTML = `<div class="grid kpis">
    ${kpi("Experiments done", d.counts.done || 0, `${d.counts.failed || 0} failed · ${d.counts.running || 0} running`)}
    ${kpi("Universe", (d.universe?.pairs || []).length, d.universe ? `${esc(d.universe.source)} · ${ago(d.universe.ts)}` : "not scanned yet")}
    ${kpi("Research", d.paused ? "paused" : "running", `<button class="btn" id="tog">${d.paused ? "resume" : "pause"}</button>`)}
  </div>
  <div class="card" style="margin-top:12px"><h2>Experiments</h2>${table([
      {h: "ID", k: "id"}, {h: "Created", f: r => ago(r.created)}, {h: "Family", k: "family"}, {h: "Pairs", num: 1, k: "pairs"},
      {h: "Status", f: r => r.status === "running" ? `running · ${esc(r.progress?.stage || "")}` : esc(r.status)},
      {h: "Verdict", f: r => r.summary?.verdict ? stage(r.summary.verdict) : "–"},
      {h: "OOS trades", num: 1, f: r => r.oos?.trades ?? "–"}, {h: "PF", num: 1, f: r => num(r.oos?.profit_factor)}, {h: "Sharpe", num: 1, f: r => num(r.oos?.sharpe)},
      {h: "DD", num: 1, f: r => pct(r.oos?.max_drawdown, 1)}, {h: "WFE", num: 1, f: r => num(r.summary?.wfe)}, {h: "DSR", num: 1, f: r => num(r.summary?.dsr)},
      {h: "Gates", f: r => r.gates ? `<div class="gates">` + Object.entries(r.gates).map(([k, g]) => `<span class="gate ${g.pass ? "ok" : "no"}" title="${esc(k)}: ${g.value} vs ${g.threshold}">${esc(k)}</span>`).join("") + `</div>` : `<span class="muted" style="white-space:normal">${esc(r.error)}</span>`}],
      d.experiments, "First experiment starts after the initial market scan and data download")}</div>
  <div class="grid" style="margin-top:12px;grid-template-columns:1fr 1fr">
      <div class="card"><h2>Family bandit (UCB1)</h2>${table([{h: "Family", f: r => esc(r[0])}, {h: "Experiments", num: 1, f: r => r[1][0]}, {h: "Mean score", num: 1, f: r => num(r[1][1], 3)}], fs)}</div>
      <div class="card"><h2>Most-failed gates (recent)</h2>${table([{h: "Gate", f: r => esc(r[0])}, {h: "Failures", num: 1, f: r => r[1]}], gf, "–")}
      <div class="note">All metrics are walk-forward out-of-sample with Bybit taker fees + slippage and funding. Stress = doubled costs. DSR = Deflated Sharpe Ratio across all experiments run.</div></div>
  </div>`;
  $("#tog").onclick = async () => { await api(`/api/control/${d.paused ? "resume" : "pause"}_research`, {method: "POST"}); render(); };
};

R.Market = async v => {
  const d = await api("/api/market");
  const rows = d.pairs.map(r => ({pair: r.pair, ts: r.ts, ...r.data})).sort((a, b) => b.trend_score - a.trend_score);
  v.innerHTML = `<div class="card"><h2>Universe & regime scores (${rows.length} pairs)</h2>${table([
    {h: "Pair", k: "pair"}, {h: "Trend score", num: 1, f: r => num(r.trend_score, 3)}, {h: "Revert score", num: 1, f: r => num(r.revert_score, 3)},
    {h: "Efficiency", num: 1, f: r => num(r.efficiency, 3)}, {h: "ADX", num: 1, f: r => num(r.adx, 1)}, {h: "Autocorr", num: 1, f: r => num(r.autocorr1, 3)},
    {h: "Vol (ann.)", num: 1, f: r => pct(r.vol_annual, 0)}, {h: "30d return", num: 1, f: r => signed(r.ret_30d, pct)}, {h: "Updated", f: r => ago(r.ts)}], rows, "Scanner has not run yet")}
    <div class="note">Trend-family research picks pairs with the highest trend score; mean-reversion research picks the highest revert score.</div></div>`;
};

R.Learnings = async v => {
  const d = await api("/api/learnings");
  v.innerHTML = `<div class="card"><h2>What the system has learned</h2>${table([
    {h: "When", f: r => ago(r.ts)}, {h: "Scope", k: "scope"}, {h: "Key", k: "key"}, {h: "Insight", f: r => `<span style="white-space:normal">${esc(r.insight)}</span>`},
    {h: "Adjustment / A-B result", f: r => `<pre>${esc(JSON.stringify(r.adjustment))}</pre>`}, {h: "Active", f: r => r.active ? "yes" : "pruned"}, {h: "Expires", f: r => esc((r.expires || "").slice(0, 10))}],
    d.learnings, "No learnings yet – they appear once demo trades and research results accumulate")}</div>`;
};

R.Health = async v => {
  const d = await api("/api/health");
  const st = s => ({ok: "good", idle: "good", busy: "good", paused: "warning", waiting: "warning", degraded: "serious", error: "critical"}[s] || "warning");
  v.innerHTML = `<div class="grid kpis">
    ${kpi("Trading bot", d.bot_up ? "running" : "DOWN", d.bot_config ? `${esc(d.bot_config.exchange)} · ${esc(d.bot_config.trading_mode)} · ${esc(d.bot_config.state)}` : "")}
    ${kpi("Last bot loop", d.bot_health ? ago(d.bot_health.last_process) : "–", d.bot_config ? `freqtrade ${esc(d.bot_config.version)}` : "")}
    ${kpi("Disk", d.disk ? pct(d.disk.used / d.disk.total, 0) : "–", d.disk ? `${num(d.disk.free / 1e9, 1)} GB free` : "")}
    ${kpi("Self-test", d.selftest ? (d.selftest.ok ? "passed" : "FAILED") : "–", d.selftest ? ago(d.selftest.ts) : "")}
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h2>Services</h2>${table([{h: "Service", k: "service"}, {h: "Status", f: r => `<span class="badge"><span class="dot" style="background:var(--${st(r.status)})"></span>${esc(r.status)}</span>`},
      {h: "Heartbeat", f: r => r.age_s === null ? "–" : (r.age_s > 900 ? `⚠ ${ago(r.ts)}` : ago(r.ts))}, {h: "Detail", f: r => `<pre>${esc(JSON.stringify(r.detail))}</pre>`}], d.heartbeats)}</div>
    <div class="card"><h2>Self-test & supervisor</h2><pre>${esc(JSON.stringify({selftest: d.selftest, supervisor: d.supervisor, bot: d.bot_config}, null, 1))}</pre></div>
  </div>`;
};

R.Events = async v => {
  const d = await api("/api/events");
  v.innerHTML = `<div class="card"><h2>Event log</h2>${table([{h: "Time (UTC)", k: "ts"}, {h: "Level", k: "level"}, {h: "Source", k: "source"}, {h: "Message", f: r => `<span style="white-space:normal">${esc(r.message)}</span>`}], d.events)}</div>`;
};

async function header() {
  try { const h = await api("/api/health"); const b = $("#botBadge");
    b.innerHTML = `<span class="dot" style="background:var(--${h.bot_up ? "good" : "critical"})"></span>bot ${h.bot_up ? "running" : "down"}`; } catch (e) {}
}
async function render() {
  const v = $("#view");
  try { await R[tab](v); $("#updated").textContent = "updated " + new Date().toLocaleTimeString(); }
  catch (e) { v.innerHTML = `<div class="card empty">Could not load: ${esc(e.message)}</div>`; }
}
nav(); render(); header();
setInterval(() => { if (!document.querySelector("details[open]")) render(); header(); }, 30000);
</script>
</body>
</html>
